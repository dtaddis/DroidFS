name: Publish existing release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      run_id:
        description: Workflow run containing the signed APK artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - name: Download signed APK artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
          pattern: DroidFS-Video-signed-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cat > release-notes.md <<'EOF'
          First independent DroidFS Video release, based on DroidFS with the
          enhanced libVLC video player.

          Choose the APK matching your device ABI. Most current Android phones
          use arm64-v8a. Verify the APK checksum and signing certificate before
          installation.

          Signing certificate SHA-256:
          E6:E2:17:40:D7:D2:09:45:54:EC:C4:A8:33:90:98:E2:7A:4E:4B:C2:74:2F:94:3C:90:61:F4:72:94:CD:5A:71
          EOF
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DroidFS Video $RELEASE_TAG" \
            --notes-file release-notes.md \
            --verify-tag
