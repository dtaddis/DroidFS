name: Build APKs

on:
  workflow_dispatch:
  push:
    branches:
      - droidfs-video
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.abi }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON((github.event_name == 'push' && github.ref_type == 'branch' && '["arm64-v8a"]') || '["arm64-v8a","armeabi-v7a","x86_64","x86"]') }}

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config npm
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Build FFmpeg for ${{ matrix.abi }}
        run: ./app/ffmpeg/build.sh "${{ matrix.abi }}"

      - name: Build libgocryptfs for ${{ matrix.abi }}
        run: ./app/libgocryptfs/build.sh "${{ matrix.abi }}"

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease -Pabi="${{ matrix.abi }}" -Pnouniversal --no-daemon

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > "SHA256SUMS-${{ matrix.abi }}.txt"

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: DroidFS-Video-unsigned-${{ matrix.abi }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS-${{ matrix.abi }}.txt
          if-no-files-found: error
          retention-days: 7
