import com.android.build.api.variant.ResValue
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'

if (hasProperty("disableCryFS")) {
    ext.disableCryFS = getProperty("disableCryFS")
} else {
    ext.disableCryFS = false
}

if (hasProperty("disableGocryptfs")) {
    ext.disableGocryptfs = getProperty("disableGocryptfs")
} else {
    ext.disableGocryptfs = false
}

ext.abiCodes  = [ "x86": 1, "x86_64": 2, "armeabi-v7a": 3, "arm64-v8a": 4]

android {
    compileSdk = 37
    ndkVersion '28.2.13676358'
    namespace "sushi.hardcore.droidfs"

    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    defaultConfig {
        applicationId "io.github.dtaddis.droidfsvideo"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 3703
        versionName "2.2.0-video.3"

        buildConfigField "boolean", "CRYFS_DISABLED", "${project.ext.disableCryFS}"
        buildConfigField "boolean", "GOCRYPTFS_DISABLED", "${project.ext.disableGocryptfs}"

        splits {
            abi {
                enable true
                reset() // fix unknown bug (https://ru.stackoverflow.com/questions/1557805/abis-armeabi-mips-mips64-riscv64-are-not-supported-for-platform)
                if (project.hasProperty("abi")) {
                    include project.getProperty("abi")
                } else {
                    abiCodes.keySet().each { abi -> include abi }
                    universalApk !project.hasProperty("nouniversal")
                }
            }
        }

        externalNativeBuild.cmake {
            arguments "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
            if (project.ext.disableGocryptfs) {
                arguments "-DGOCRYPTFS=OFF"
            }
            if (project.ext.disableCryFS) {
                arguments "-DCRYFS=OFF"
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
    }

    lint {
        // LintVital crashes in AGP 9.3.0 due to internal JavaDocParser incompatibility
        // (see https://github.com/objectbox/objectbox-java/issues/1241). Remove when fixed upstream.
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            if (project.hasProperty("smoothSloMoDiagnostic")) {
                applicationIdSuffix ".smoothdebug"
                versionNameSuffix "-smoothdebug"
                debuggable true
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }

    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '4.1.2'
        }
    }

    sourceSets {
        main {
            assets.srcDir 'build/generated/rifeAssets'
            java {
                exclude 'androidx/camera/video/originals/**'
            }
            kotlin {
                exclude 'androidx/camera/video/originals/**'
            }
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.resValues.put(
            variant.makeResValueKey("string", "versionName"),
            new ResValue(variant.outputs.first().versionName.get(), "")
        )
        variant.outputs.each { output ->
            def abiFilter = output.filters.find { it.filterType.name() == 'ABI' }
            def abi = abiFilter?.identifier
            def abiCode = abi ? (project.ext.abiCodes[abi] ?: 0) : 0
            def baseVersionCode = output.versionCode.get()
            output.versionCode.set(baseVersionCode * 10 + abiCode)
            output.outputFileName.set("DroidFS-Video-v${android.defaultConfig.versionName}-${variant.name}-${abi ?: 'universal'}.apk")
        }
    }
}

def copyRifeAssets = tasks.register('copyRifeAssets', Copy) {
    from('rife-ncnn-vulkan/models/rife-v4.6') {
        include 'flownet.bin', 'flownet.param'
        into 'rife-v4.6'
    }
    from('rife-ncnn-vulkan/LICENSE') {
        rename { 'RIFE-ncnn-vulkan-LICENSE.txt' }
        into 'third-party-licenses'
    }
    from('rife-ncnn-vulkan/src/ncnn/LICENSE.txt') {
        rename { 'ncnn-LICENSE.txt' }
        into 'third-party-licenses'
    }
    into layout.buildDirectory.dir('generated/rifeAssets')
}

tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.dependsOn(copyRifeAssets)
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation project(":libpdfviewer:app")
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.2"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.biometric:biometric-ktx:1.2.0-alpha05"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation 'com.google.android.material:material:1.13.0'

    def lifecycle_version = "2.9.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"

    implementation "io.coil-kt.coil3:coil:3.4.0"
    implementation "io.coil-kt.coil3:coil-video:3.4.0"

    def media3_version = "1.8.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+2"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    implementation "org.videolan.android:libvlc-all:3.7.0"

    def camerax_version = "1.4.2"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-extensions:$camerax_version"

    // dependencies needed by CameraX patch
    implementation "androidx.concurrent:concurrent-futures:1.3.0"
    def autoValueVersion = '1.11.1'
    implementation "com.google.auto.value:auto-value-annotations:$autoValueVersion"
    annotationProcessor "com.google.auto.value:auto-value:$autoValueVersion"
}
